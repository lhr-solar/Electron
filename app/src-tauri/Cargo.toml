[package]
name = "can-app"
version = "0.1.0"
description = "CAN desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "can_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["path"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
