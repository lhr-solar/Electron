services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: lhrs2025!
      DOCKER_INFLUXDB_INIT_ORG: LHRS
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_main
      DOCKER_INFLUXDB_INIT_RETENTION: 0   # keep forever
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-}
    volumes:
      # Host DATA_FOLDER/.db (default: project root/.db via ../.db from grafana/)
      - ${DATA_FOLDER:-..}/.db:/var/lib/influxdb2
      - ./influxdb-init.sh:/docker-entrypoint-initdb.d/influxdb-init.sh:ro
      - ./provisions:/shared-provisioning
    restart: unless-stopped

  grafana:
    image: grafana/grafana:main
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lhrs2025!
      GF_DEFAULT_USER_LOGIN: solar
      GF_DEFAULT_USER_PASSWORD: lhrs
      GF_DEFAULT_USER_NAME: Solar
      GF_DEFAULT_USER_EMAIL: solar@localhost
      GF_DEFAULT_USER_ROLE: Viewer
      # Dedicated public hostname (cloudflared → :3000). LAN can still use :3000 directly.
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://grafana.lhrsolar.org/}
      GF_SERVER_DOMAIN: ${GF_SERVER_DOMAIN:-grafana.lhrsolar.org}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # Hostnames only (no scheme).
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: ${GF_SECURITY_CSRF_TRUSTED_ORIGINS:-grafana.lhrsolar.org,electron.lhrsolar.org,influx.lhrsolar.org,192.168.1.137,localhost,127.0.0.1}
      GF_SECURITY_CSRF_ADDITIONAL_HEADERS: X-Forwarded-Host
      # Auto configure Grafana InfluxDB datasource
      GF_PROVISIONING_ENABLED: "true"
      # Influx historical panels; Live stats update via WS (refresh still helps graphs).
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
      GF_LIVE_ENABLED: "true"
      GF_LIVE_MAX_CONNECTIONS: "500"
      GF_LIVE_ALLOWED_ORIGINS: ${GF_LIVE_ALLOWED_ORIGINS:-https://grafana.lhrsolar.org,https://electron.lhrsolar.org,http://192.168.1.137:3000,http://localhost:3000}
      # Anonymous read-only viewing (no login required); admin login still edits
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_BASIC_ENABLED: "true"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisions:/etc/grafana/provisioning/
      - ./dashboards:/etc/grafana/dashboards
      - ./grafana-init-users.sh:/usr/local/bin/grafana-init-users.sh:ro
      - ./grafana-entrypoint.sh:/usr/local/bin/grafana-entrypoint.sh:ro
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/grafana-entrypoint.sh"]

volumes:
  grafana_data:
