services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: lhrs2025!
      DOCKER_INFLUXDB_INIT_ORG: LHRS
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_main
      DOCKER_INFLUXDB_INIT_RETENTION: 0   # keep forever
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-}
    volumes:
      # Host DATA_FOLDER/.db (default: project root/.db via ../.db from grafana/)
      - ${DATA_FOLDER:-..}/.db:/var/lib/influxdb2
      - ./influxdb-init.sh:/docker-entrypoint-initdb.d/influxdb-init.sh:ro
      - ./provisions:/shared-provisioning
    restart: unless-stopped

  grafana:
    image: grafana/grafana:main
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lhrs2025!
      GF_DEFAULT_USER_LOGIN: solar
      GF_DEFAULT_USER_PASSWORD: lhrs
      GF_DEFAULT_USER_NAME: Solar
      GF_DEFAULT_USER_EMAIL: solar@localhost
      GF_DEFAULT_USER_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:4000/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Auto configure Grafana InfluxDB datasource
      GF_PROVISIONING_ENABLED: "true"
      # Realtime dashboards: allow 0.5s auto-refresh
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "500ms"
      # Anonymous read-only viewing (no login required); admin login still edits
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_BASIC_ENABLED: "true"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisions:/etc/grafana/provisioning/
      - ./dashboards:/etc/grafana/dashboards
      - ./grafana-init-users.sh:/usr/local/bin/grafana-init-users.sh:ro
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "echo '>>> Waiting for Grafana provisioning files...'; \
       while [ ! -f /etc/grafana/provisioning/datasources/influx.yml ]; do sleep 1; done; \
       /usr/local/bin/grafana-init-users.sh & \
       exec /run.sh"

volumes:
  grafana_data:
