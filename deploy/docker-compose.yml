# Full server stack: Python backend (role: server — serves the web app + REST/WS
# API + TCP slcan listener) + InfluxDB (sink) + Grafana (dashboards).
#
# Secrets come from deploy/.env (see .env.example). Validate with:
#   docker compose -f deploy/docker-compose.yml config
# Bring up (build context is the repo root):
#   docker compose -f deploy/docker-compose.yml up --build

services:
  influxdb:
    image: influxdb:2.7
    container_name: lhr-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: lhr-backend
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8350"   # REST/WS API + served web app
      - "${SLCAN_PORT}:8187"     # TCP slcan listener — the vehicle connects here
    environment:
      # server.config.json references ${INFLUX_TOKEN}; backend expands it at boot.
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      BACKEND_CONFIG: /repo/backend/examples/server.config.json
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lhr-grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_PROVISIONING_ENABLED: "true"
      # Datasource provisioning reads the token from the env (no secret in YAML).
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards generated by mdc2grafana during the backend image build.
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  influx_data:
  grafana_data:
