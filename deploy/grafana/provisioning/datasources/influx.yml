apiVersion: 1

# Reuses grafana/provisions/datasources/influx.yml shape (read-only reference).
# Token + org/bucket come from the environment (set in docker-compose.yml from
# .env) so no secret is committed here.
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      token: ${INFLUX_TOKEN}
